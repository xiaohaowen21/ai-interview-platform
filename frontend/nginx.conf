server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow larger file uploads
    client_max_body_size 50M;

    # 部署在宿主机反向代理之后时，按 X-Forwarded-For 从右往左取第一个非内网地址作为真实客户端 IP，
    # 客户端自己伪造的 X-Forwarded-For 前缀不会被采信。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 内部接口只给容器之间调用（如语音服务拉取运行时配置），不对外暴露
    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeout for long-running AI requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 语音服务本身不校验身份，先由后端确认登录状态和调用额度
    location = /_voice_auth {
        internal;
        proxy_pass http://app:8080/api/voice/access-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location @voice_unauthorized {
        default_type application/json;
        return 401 '{"detail":"请先登录后再使用语音功能"}';
    }

    location @voice_quota_exceeded {
        default_type application/json;
        return 429 '{"detail":"语音请求过于频繁，请稍后再试"}';
    }

    location /voice-api/ {
        auth_request /_voice_auth;
        error_page 401 = @voice_unauthorized;
        error_page 403 = @voice_quota_exceeded;
        client_max_body_size 13m;

        proxy_pass http://voice:8091/api/voice/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }
}
