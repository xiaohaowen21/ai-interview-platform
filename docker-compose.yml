services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interview_guide
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: interview-redis
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: interview-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/interview-guide;
      /usr/bin/mc anonymous set public myminio/interview-guide;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: interview-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: interview_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

      REDIS_HOST: redis
      REDIS_PORT: 6379

      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: minioadmin
      APP_STORAGE_SECRET_KEY: minioadmin
      APP_STORAGE_BUCKET: interview-guide
      APP_STORAGE_REGION: us-east-1

      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen-plus}

      APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
      APP_INTERVIEW_EVALUATION_BATCH_SIZE: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:-8}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123456}
      APP_MOCK_INTERVIEW_URL: ${APP_MOCK_INTERVIEW_URL:-https://mianbaojob.xyz/mock-interview}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://mianbaojob.xyz,http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://localhost:5173,http://localhost:5174}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_HOST: ${APP_MAIL_HOST:-}
      APP_MAIL_PORT: ${APP_MAIL_PORT:-587}
      APP_MAIL_USERNAME: ${APP_MAIL_USERNAME:-}
      APP_MAIL_PASSWORD: ${APP_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_SENDER_NAME: ${APP_MAIL_SENDER_NAME:-}
      APP_MAIL_SMTP_AUTH: ${APP_MAIL_SMTP_AUTH:-true}
      APP_MAIL_SMTP_SSL_ENABLE: ${APP_MAIL_SMTP_SSL_ENABLE:-false}
      APP_MAIL_SMTP_STARTTLS: ${APP_MAIL_SMTP_STARTTLS:-true}
      APP_TURNSTILE_ENABLED: ${APP_TURNSTILE_ENABLED:-false}
      APP_TURNSTILE_SECRET_KEY: ${APP_TURNSTILE_SECRET_KEY:-}
      APP_INTERNAL_VOICE_TOKEN: ${APP_INTERNAL_VOICE_TOKEN:-}
    ports:
      - "8080:8080"

  voice:
    build:
      context: ./voice-service
    container_name: interview-voice
    environment:
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      VOICE_QWEN_MODEL: ${VOICE_QWEN_MODEL:-qwen3-tts-instruct-flash}
      VOICE_RUNTIME_CONFIG_URL: ${VOICE_RUNTIME_CONFIG_URL:-http://app:8080/api/internal/voice/runtime-ai-config}
      VOICE_RUNTIME_CONFIG_TOKEN: ${APP_INTERNAL_VOICE_TOKEN:-}
    ports:
      - "8091:8091"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        NGINX_CONF: nginx.conf
    container_name: interview-frontend
    depends_on:
      - app
      - voice
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
